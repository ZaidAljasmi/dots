# # Messages
# set -g message-style "bg=#1e1e2e,fg=#cdd6f4"

# Status bar habamax theme 
set -g status-style "bg=#181818,fg=#c7c7c7"
# Copy-mode / selection
set -g mode-style "bg=#3a3a3a,fg=#c7c7c7"
# Messages
set -g message-style "bg=#181818,fg=#c7c7c7"
